name: save_my_bills
description: A Flutter app for managing bill screenshots

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # GraphQL Client
  graphql_flutter: ^5.1.2
  
  # SQLite for local storage
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # State Management
  provider: ^6.1.1
  
  # Image handling
  image_picker: ^1.0.4
  
  # HTTP for file upload
  http: ^1.1.0
  dio: ^5.4.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  
  # Date/Time formatting
  intl: ^0.18.1
  
  # Local storage
  shared_preferences: ^2.2.2
  
  # File handling
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  # assets:
  #   - images/
