spring:
  application:
    name: save-my-bills-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/savemybills
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  data:
    mongodb:
      uri: mongodb://localhost:27017/savemybills
      database: savemybills
  
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    path: /graphql
    schema:
      printer:
        enabled: true

server:
  port: 8080

google:
  drive:
    folder:
      id: root
  credentials:
    path: ${GOOGLE_CREDENTIALS_PATH:}

logging:
  level:
    com.savemybills: DEBUG
    org.springframework.graphql: DEBUG
